# Postgres unico com varios bancos (Database per Service via init script).
# StatefulSet para garantir storage estavel (PVC) e identidade fixa do pod.
# Para producao seria substituido por operator (CloudNativePG / Zalando).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: saude-poc
data:
  init-databases.sql: |
    CREATE DATABASE patientdb;
    CREATE DATABASE examdb;
    CREATE DATABASE resultdb;
    CREATE DATABASE authdb;
    CREATE DATABASE consentdb;
    CREATE DATABASE auditdb;
    CREATE DATABASE notificationdb;
    CREATE DATABASE triagedb;
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: saude-poc
spec:
  clusterIP: None    # headless para StatefulSet
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: saude-poc
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          # max_connections padrao da imagem e 100. Com 8 servicos com banco,
          # ate 10 replicas cada (HPA) e pool de 5, o pico e ~400 conexoes:
          # sem este ajuste os pods morrem com
          # "FATAL: sorry, too many clients already" durante o escalonamento.
          args:
            - -c
            - max_connections=500
            - -c
            - shared_buffers=512MB
            - -c
            - effective_cache_size=1536MB
            - -c
            - max_wal_size=2GB
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom: { configMapKeyRef: { name: shared-config, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-secrets, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              value: postgres
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            # /dev/shm padrao do container e 64 MB; o Postgres usa memoria
            # compartilhada para workers paralelos e falha ao esgota-la.
            - name: dshm
              mountPath: /dev/shm
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "saude"] }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            # Limite anterior (1 core / 1 GiB) transformaria o banco no gargalo
            # do experimento. Com folga, o ponto de ruptura medido passa a ser
            # da ARQUITETURA, nao de um teto arbitrario de configuracao.
            requests: { cpu: "1000m", memory: "1Gi" }
            limits:   { cpu: "8000m", memory: "4Gi" }
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
