apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: saude-poc
  labels: { app: audit-service }
spec:
  ports: [{ name: http, port: 8088, targetPort: 8088 }]
  selector: { app: audit-service }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: saude-poc
  labels: { app: audit-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: audit-service }
  template:
    metadata:
      labels: { app: audit-service, version: v1 }
    spec:
      containers:
        - name: audit-service
          image: saude-publica-poc-audit-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8088 }]
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/auditdb" }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { configMapKeyRef: { name: shared-config, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-secrets, key: POSTGRES_PASSWORD } }
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: shared-config, key: SPRING_KAFKA_BOOTSTRAP_SERVERS } }
            - name: AUDIT_ANOMALY_THRESHOLD
              valueFrom: { configMapKeyRef: { name: shared-config, key: AUDIT_ANOMALY_THRESHOLD } }
            - name: AUDIT_ANOMALY_WINDOW_MINUTES
              valueFrom: { configMapKeyRef: { name: shared-config, key: AUDIT_ANOMALY_WINDOW_MINUTES } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8088 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8088 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audit-service
  namespace: saude-poc
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: audit-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
