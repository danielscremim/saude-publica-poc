# Configuracoes compartilhadas pelos servicos.
# Valores nao sensiveis vao em ConfigMap; segredos vao em Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-config
  namespace: saude-poc
data:
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  AUTH_JWT_ISSUER: "https://saude-poc.usp.esalq/auth"
  POSTGRES_HOST: "postgres"
  POSTGRES_USER: "saude"
  # URLs internas dos servicos a montante (history depende destas).
  DOWNSTREAM_PATIENT_URL: "http://patient-service:8081"
  DOWNSTREAM_RESULT_URL:  "http://result-service:8084"
  DOWNSTREAM_CONSENT_URL: "http://consent-service:8086"
  # Threshold de anomaly detection (PoC: 10 para demo; RNF default seria 200).
  AUDIT_ANOMALY_THRESHOLD: "10"
  AUDIT_ANOMALY_WINDOW_MINUTES: "10"
---
# Segredos. Em producao viria de External Secrets Operator (Vault/SecretsManager).
# stringData e codificado em base64 automaticamente pelo k8s.
apiVersion: v1
kind: Secret
metadata:
  name: shared-secrets
  namespace: saude-poc
type: Opaque
stringData:
  AUTH_JWT_SECRET: "c2F1ZGUtcG9jLXNlY3JldC1taW4tMjU2LWJpdHMtcGFkLXBhZC1wYWQtcGFk"
  POSTGRES_PASSWORD: "saude"
