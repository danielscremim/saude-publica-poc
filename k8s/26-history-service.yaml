apiVersion: v1
kind: Service
metadata:
  name: history-service
  namespace: saude-poc
  labels: { app: history-service }
spec:
  ports: [{ name: http, port: 8087, targetPort: 8087 }]
  selector: { app: history-service }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: history-service
  namespace: saude-poc
  labels: { app: history-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: history-service }
  template:
    metadata:
      labels: { app: history-service, version: v1 }
    spec:
      containers:
        - name: history-service
          image: saude-publica-poc-history-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8087 }]
          env:
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              valueFrom: { configMapKeyRef: { name: shared-config, key: SPRING_KAFKA_BOOTSTRAP_SERVERS } }
            - name: AUTH_JWT_SECRET
              valueFrom: { secretKeyRef: { name: shared-secrets, key: AUTH_JWT_SECRET } }
            - name: AUTH_JWT_ISSUER
              valueFrom: { configMapKeyRef: { name: shared-config, key: AUTH_JWT_ISSUER } }
            - name: DOWNSTREAM_PATIENT_URL
              valueFrom: { configMapKeyRef: { name: shared-config, key: DOWNSTREAM_PATIENT_URL } }
            - name: DOWNSTREAM_RESULT_URL
              valueFrom: { configMapKeyRef: { name: shared-config, key: DOWNSTREAM_RESULT_URL } }
            - name: DOWNSTREAM_CONSENT_URL
              valueFrom: { configMapKeyRef: { name: shared-config, key: DOWNSTREAM_CONSENT_URL } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8087 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: history-service
  namespace: saude-poc
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: history-service }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
