apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: saude-poc
  labels: { app: patient-service }
spec:
  ports:
    - name: http
      port: 8081
      targetPort: 8081
  selector: { app: patient-service }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: saude-poc
  labels: { app: patient-service }
spec:
  replicas: 2          # RNF-02
  selector:
    matchLabels: { app: patient-service }
  template:
    metadata:
      labels: { app: patient-service, version: v1 }
      annotations:                            # RNF-04: metricas de aplicacao
        prometheus.io/scrape: "true"           # o istio-agent faz merge com as metricas do Envoy
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8081"
    spec:
      containers:
        - name: patient-service
          image: saude-publica-poc-patient-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 8081, name: http }
            # Porta do pilot-agent do Istio, que publica as metricas do Envoy
            # JUNTO com o /actuator/prometheus da aplicacao (enablePrometheusMerge).
            # Precisa estar DECLARADA: o PodMonitor filtra por
            # __meta_kubernetes_pod_container_port_number, que so existe para
            # portas declaradas - sem isso o alvo e descartado em silencio.
            # containerPort e informativo; quem atende a 15020 e o sidecar.
            - { containerPort: 15020, name: istio-merged }
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://postgres:5432/patientdb" }
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { configMapKeyRef: { name: shared-config, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: shared-secrets, key: POSTGRES_PASSWORD } }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits:   { cpu: "1000m", memory: "1Gi" }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: patient-service
  namespace: saude-poc
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: patient-service }
  minReplicas: 2
  maxReplicas: 6     # MEDIDO, nao arbitrado. Ver docs/resultados-bateria-carga.md §8:
                     # com maxReplicas=10 neste no de 32 vCPUs o P95 foi de 38,3 s
                     # com 22,8% de erro; com 6, caiu para 918 ms com 0,00% de erro
                     # e 9,4x mais vazao. Cada replica traz uma JVM e um sidecar
                     # Envoy: acima da capacidade do no, escalar DEGRADA.
                     # Em cluster com mais nos este valor deve ser recalculado.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }   # RNF-01
