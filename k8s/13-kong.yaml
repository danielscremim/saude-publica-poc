# Kong continua sendo o gateway de norte-sul (ingress). Istio gere o mesh interno.
# Em producao seria Kong Ingress Controller; aqui mantemos DB-less com declarativa.
apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: saude-poc
data:
  kong.yml: |
    _format_version: "3.0"
    services:
      - name: patient-service
        url: http://patient-service:8081
        routes:
          - { name: patient-route, paths: [/v1/patients], strip_path: false }
        plugins:
          - { name: rate-limiting, config: { minute: 10000, policy: local } }
      - name: exam-service
        url: http://exam-service:8082
        routes: [{ name: exam-route, paths: [/v1/exams], strip_path: false }]
      - name: result-service
        url: http://result-service:8084
        routes: [{ name: result-route, paths: [/v1/results], strip_path: false }]
      - name: auth-service
        url: http://auth-service:8085
        routes:
          - { name: auth-token-route, paths: [/v1/auth], strip_path: false }
          - { name: auth-clients-route, paths: [/v1/clients], strip_path: false }
      - name: consent-service
        url: http://consent-service:8086
        routes: [{ name: consent-route, paths: [/v1/consents], strip_path: false }]
      - name: history-service
        url: http://history-service:8087
        routes:
          - { name: history-timeline-route, paths: ["~/v1/patients/[^/]+/clinical-timeline$"], strip_path: false }
          - { name: history-graphql-route,  paths: [/graphql],  strip_path: false }
          - { name: history-graphiql-route, paths: [/graphiql], strip_path: false }
      - name: audit-service
        url: http://audit-service:8088
        routes: [{ name: audit-route, paths: [/v1/audit], strip_path: false }]
      - name: notification-service
        url: http://notification-service:8089
        routes: [{ name: notification-route, paths: [/v1/notifications], strip_path: false }]
      - name: triage-service
        url: http://triage-service:8090
        routes: [{ name: triage-route, paths: [/v1/triages], strip_path: false }]
---
apiVersion: v1
kind: Service
metadata:
  name: kong
  namespace: saude-poc
spec:
  # NodePort fixo: o cluster entregue (k3d) esta SEM ServiceLB, entao um Service
  # do tipo LoadBalancer ficaria eternamente <pending>. O NodePort 30800 e
  # publicado na porta 8000 da VM-1 pelo load balancer do k3d (ver GUIA-VMS).
  # NAO usar kubectl port-forward para a carga: a execucao [3] registrada no
  # cabecalho de tests/k6/load.js mostra ~300 ms de overhead por requisicao.
  type: NodePort
  ports:
    - { name: proxy, port: 8000, targetPort: 8000, nodePort: 30800 }
    - { name: admin, port: 8001, targetPort: 8001, nodePort: 30801 }
  selector:
    app: kong
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: saude-poc
spec:
  replicas: 2     # RNF-02: gateway com >=2 replicas
  selector:
    matchLabels: { app: kong }
  template:
    metadata:
      labels: { app: kong }
    spec:
      containers:
        - name: kong
          image: kong:3.7
          ports:
            - { containerPort: 8000 }
            - { containerPort: 8001 }
          env:
            - { name: KONG_DATABASE, value: "off" }
            - { name: KONG_DECLARATIVE_CONFIG, value: "/kong/kong.yml" }
            - { name: KONG_PROXY_ACCESS_LOG, value: "/dev/stdout" }
            - { name: KONG_ADMIN_ACCESS_LOG, value: "/dev/stdout" }
            - { name: KONG_PROXY_ERROR_LOG, value: "/dev/stderr" }
            - { name: KONG_ADMIN_ERROR_LOG, value: "/dev/stderr" }
            - { name: KONG_ADMIN_LISTEN, value: "0.0.0.0:8001" }
            # O nginx do Kong le a contagem de CPUs DO NO (32 nesta VM), ignora o
            # limite do container e sobe 33 workers -> estourou 1 GiB e o kubelet
            # matou o processo (exit 137). Fixar o numero e obrigatorio em no grande.
            - { name: KONG_NGINX_WORKER_PROCESSES, value: "4" }
            # RNF-01: o padrao herdado e RLIMIT_NOFILE 1024. Com 1000 VUs o
            # gateway esgotaria descritores e registraria erro que NAO e do
            # sistema sob teste.
            - { name: KONG_NGINX_MAIN_WORKER_RLIMIT_NOFILE, value: "65536" }
            - { name: KONG_NGINX_EVENTS_WORKER_CONNECTIONS, value: "16384" }
            - { name: KONG_MEM_CACHE_SIZE, value: "256m" }
          volumeMounts:
            - { name: config, mountPath: /kong }
          readinessProbe:
            httpGet: { path: /status, port: 8001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # Todo o trafego norte-sul passa aqui. Com 500m o proprio gateway
            # viraria o gargalo e a medida deixaria de ser da arquitetura.
            requests: { cpu: "500m", memory: "512Mi" }
            limits:   { cpu: "4000m", memory: "2Gi" }
      volumes:
        - name: config
          configMap: { name: kong-config }
