server:
  port: 8085

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${SPRING_DATASOURCE_USERNAME:saude}
    password: ${SPRING_DATASOURCE_PASSWORD:saude}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuracao do JWT (RNF-03). Em producao, segredo viria de Vault/Secret.
auth:
  jwt:
    # Segredo de 256 bits (base64). Default apenas para PoC; sobrescrever via env em qualquer ambiente real.
    secret: ${AUTH_JWT_SECRET:c2F1ZGUtcG9jLXNlY3JldC1taW4tMjU2LWJpdHMtcGFkLXBhZC1wYWQtcGFk}
    issuer: ${AUTH_JWT_ISSUER:https://saude-poc.usp.esalq/auth}
    expiration-seconds: ${AUTH_JWT_EXPIRATION_SECONDS:3600}  # RNF-03: 1h

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
