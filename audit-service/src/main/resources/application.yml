server:
  port: 8088

spring:
  application:
    name: audit-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auditdb}
    username: ${SPRING_DATASOURCE_USERNAME:saude}
    password: ${SPRING_DATASOURCE_PASSWORD:saude}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: audit-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: br.usp.esalq.saude.audit.event.AuditEvent
        # Records de evento sao duplicados em cada servico; ver memoria/feedback_kafka_type_headers.
        spring.json.use.type.headers: false

# Detecao de anomalia (RNF-06): default RNF e 200/10min.
# Em docker-compose o threshold e baixado para 10 para demonstrar a detecao no script de teste.
audit:
  anomaly:
    window-minutes: ${AUDIT_ANOMALY_WINDOW_MINUTES:10}
    threshold: ${AUDIT_ANOMALY_THRESHOLD:200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
