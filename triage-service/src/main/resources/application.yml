server:
  port: 8090
  tomcat:
    mbeanregistry:
      # RNF-04: sem isto o Spring Boot nao registra os MBeans do Tomcat e o
      # binder do Micrometer nao publica tomcat_threads_busy_threads - a
      # metrica fica ausente sem nenhum erro. E o dado que mostra se a
      # saturacao foi de threads ou de conexoes de banco.
      enabled: true

spring:
  application:
    name: triage-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/triagedb}
    username: ${SPRING_DATASOURCE_USERNAME:saude}
    password: ${SPRING_DATASOURCE_PASSWORD:saude}
    # RNF-01: o pool precisa CABER no max_connections do Postgres (500, ver
    # k8s/10-postgres.yaml). Sao 8 servicos com banco x ate 10 replicas (HPA)
    # x este tamanho = 8*10*5 = 400, com folga para conexoes administrativas.
    # Sem esse limite o HikariCP usa 10 por instancia e o banco responde
    # "FATAL: sorry, too many clients already" durante o escalonamento.
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:5}
      minimum-idle: ${HIKARI_MIN_IDLE:1}
      connection-timeout: 10000
      max-lifetime: 900000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
