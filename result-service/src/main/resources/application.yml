server:
  port: 8084

spring:
  application:
    name: result-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resultdb}
    username: ${SPRING_DATASOURCE_USERNAME:saude}
    password: ${SPRING_DATASOURCE_PASSWORD:saude}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: result-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: br.usp.esalq.saude.result.event.ExamCompletedEvent
        # Ignora o header de tipo do produtor (que aponta para a classe no pacote do lab-service)
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: true

# Compartilha segredo/issuer com o auth-service para validar tokens emitidos por ele (RNF-03).
# Usado apenas no POST /v1/results (fluxo bidirecional: lab/hospital externo enviando resultado).
auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:c2F1ZGUtcG9jLXNlY3JldC1taW4tMjU2LWJpdHMtcGFkLXBhZC1wYWQtcGFk}
    issuer: ${AUTH_JWT_ISSUER:https://saude-poc.usp.esalq/auth}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html
