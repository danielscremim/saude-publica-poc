server:
  port: 8081

spring:
  application:
    name: patient-service
  datasource:
    # Default aponta para localhost (execucao via VSCode). Em Docker, sobrescrito por env var.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/patientdb}
    username: ${SPRING_DATASOURCE_USERNAME:saude}
    password: ${SPRING_DATASOURCE_PASSWORD:saude}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
